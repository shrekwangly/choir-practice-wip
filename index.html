<!doctype html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>合唱练习资料库</title>
<style>
:root{--ink:#20312d;--muted:#687873;--green:#176b52;--light:#eef5f1;--line:#dce7e1;--white:#fff;--gold:#e3b65d;--red:#a63c35}
*{box-sizing:border-box}body{margin:0;background:#f6f8f5;color:var(--ink);font:16px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}header{background:linear-gradient(120deg,#143f35,#24775b);color:#fff;padding:34px 20px 30px}.wrap{max-width:1020px;margin:auto;padding:0 20px}header .wrap{padding:0 20px}.eyebrow{font-size:13px;letter-spacing:.12em;color:#cce4d7}h1{font-size:clamp(27px,5vw,40px);margin:8px 0}.sub{color:#d9e9e1;margin:0}.main{padding-top:24px;padding-bottom:48px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.search{flex:1;min-width:210px}.search input,select,input,textarea{font:inherit}.search input{width:100%}input,select,textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;color:var(--ink)}button,.button{border:0;border-radius:10px;padding:11px 16px;background:var(--green);color:white;font:inherit;font-weight:650;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}button:hover,.button:hover{filter:brightness(.94)}button.secondary{background:#e7efe9;color:var(--ink)}button.danger{background:#fff0ed;color:var(--red)}.hint{font-size:13px;color:var(--muted);margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,390px),1fr));gap:16px}.card,.panel{background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 16px #183b2c0a}.card{padding:18px}.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.card h2{font-size:20px;margin:0 0 3px}.meta{font-size:14px;color:var(--muted)}.tag{white-space:nowrap;background:var(--light);color:var(--green);border-radius:999px;padding:5px 10px;font-size:13px}.links{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.links a{font-size:14px}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#17231f;margin-top:4px}.video video{width:100%;height:100%;object-fit:contain;border-radius:12px}.note{white-space:pre-wrap;color:#52625c;font-size:14px;margin:12px 0 0}.manage{margin-top:28px;padding:20px}.manage h2{margin:0 0 5px}.manage p{color:var(--muted);font-size:14px;margin:0 0 16px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px;font-size:14px;font-weight:600}.field.full{grid-column:1/-1}.field small{font-weight:400;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.empty{grid-column:1/-1;text-align:center;padding:32px 18px;color:var(--muted);background:white;border:1px dashed var(--line);border-radius:16px}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}.cardactions{display:flex;gap:8px;margin-top:14px}.cardactions button{padding:8px 12px;font-size:14px}.status{min-height:22px;color:var(--green);font-size:14px;margin-top:10px}@media(max-width:600px){.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{padding-left:14px;padding-right:14px}header{padding:28px 0 24px}.manage{padding:16px}}
</style>
</head>
<body>
<header><div class='wrap'><div class='eyebrow'>CHOIR PRACTICE LIBRARY</div><h1>合唱练习资料库</h1><p class='sub'>歌谱与分声部练习视频，排练前随时查看。</p></div></header>
<main class='wrap main'>
<div class='toolbar'><label class='search'><input id='search' type='search' placeholder='搜索歌名、作曲者或备注' aria-label='搜索歌目'></label><select id='filter' aria-label='按声部筛选'><option value='全部声部'>全部声部</option><option>女高音</option><option>女低音</option><option>男高音</option><option>男低音</option><option>全团</option></select></div>
<p class='hint'>选择歌目即可打开歌谱或播放练习视频。视频支持 YouTube 链接和直接视频文件链接。</p>
<section id='songs' class='grid' aria-live='polite'></section>
<section class='panel manage' id='management'><h2>团长管理</h2><p>添加或维护歌目资料。歌谱和视频请填写团员可访问的链接。</p>
<form id='songForm'><input type='hidden' id='editId'><div class='formgrid'>
<label class='field'>歌名<input id='title' required maxlength='100' placeholder='例如：团练曲目'></label>
<label class='field'>作曲者 / 编曲者<input id='composer' maxlength='100' placeholder='可留空'></label>
<label class='field'>声部<select id='voice'><option>全团</option><option>女高音</option><option>女低音</option><option>男高音</option><option>男低音</option></select></label>
<label class='field'>歌谱链接<input id='score' type='url' placeholder='https://…'><small>可填写 PDF 或共享文件链接</small></label>
<label class='field full'>练习音频 / 视频直链<input id='video' type='url' placeholder='填写团员有权访问的 MP3 或 MP4 文件链接'></label>
<label class='field full'>练习提示<textarea id='notes' rows='2' maxlength='500' placeholder='例如：先跟节拍器慢速练习'></textarea></label>
</div><div class='actions'><button type='submit' id='saveBtn'>添加歌目</button><button type='button' class='secondary' id='cancelEdit' hidden>取消编辑</button></div><div id='status' class='status' role='status'></div></form></section>
</main>
<script>
const STORE_KEY='choir-practice-library-v1';
const $=id=>document.getElementById(id);
let songs=[];
try{songs=JSON.parse(localStorage.getItem(STORE_KEY)||'[]');if(!Array.isArray(songs))songs=[]}catch{songs=[]}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(songs));return true}catch{return false}}
function safeUrl(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function videoElement(raw){const url=safeUrl(raw);if(!url)return null;let embed='';try{const u=new URL(url),host=u.hostname.toLowerCase();if(host==='youtu.be')embed='https://www.youtube-nocookie.com/embed/'+u.pathname.slice(1);else if(host.endsWith('youtube.com')){const id=u.searchParams.get('v');if(id)embed='https://www.youtube-nocookie.com/embed/'+id;else if(u.pathname.startsWith('/embed/'))embed='https://www.youtube-nocookie.com'+u.pathname;else if(u.pathname.startsWith('/shorts/'))embed='https://www.youtube-nocookie.com/embed/'+u.pathname.split('/')[2]} }catch{}
if(embed){const frame=document.createElement('iframe');frame.className='video';frame.src=embed;frame.title='练习视频';frame.loading='lazy';frame.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';frame.allowFullscreen=true;return frame}
if(/\.(mp4|webm|ogg)(\?.*)?$/i.test(url)){const wrap=document.createElement('div');wrap.className='video';const v=document.createElement('video');v.controls=true;v.preload='metadata';v.src=url;wrap.append(v);return wrap}return null}
function render(){const query=$('search').value.trim().toLowerCase(),voice=$('filter').value;const shown=songs.filter(s=>(voice==='全部声部'||s.voice===voice||s.voice==='全团')&&[s.title,s.composer,s.notes].join(' ').toLowerCase().includes(query));const root=$('songs');root.replaceChildren();if(!shown.length){const empty=document.createElement('div');empty.className='empty';const strong=document.createElement('strong');strong.textContent=songs.length?'没有找到匹配的歌目':'资料库还没有歌目';empty.append(strong,document.createTextNode(songs.length?'试试更换搜索词或声部筛选。':'团长可在下方添加歌谱和练习视频链接。'));root.append(empty);return}
for(const s of shown){const card=document.createElement('article');card.className='card';const head=document.createElement('div');head.className='cardhead';const titleBox=document.createElement('div');const h=document.createElement('h2');h.textContent=s.title;titleBox.append(h);if(s.composer){const meta=document.createElement('div');meta.className='meta';meta.textContent=s.composer;titleBox.append(meta)}const tag=document.createElement('span');tag.className='tag';tag.textContent=s.voice||'全团';head.append(titleBox,tag);card.append(head);
const links=document.createElement('div');links.className='links';const score=safeUrl(s.score);if(score){const a=document.createElement('a');a.className='button';a.href=score;a.target='_blank';a.rel='noopener noreferrer';a.textContent='查看歌谱';links.append(a)}if(s.video){const a=document.createElement('a');a.className='button secondary';a.href=safeUrl(s.video)||'#';if(a.href!=='#'){a.target='_blank';a.rel='noopener noreferrer'}a.textContent='单独打开视频';links.append(a)}if(links.childNodes.length)card.append(links);
const player=videoElement(s.video);if(player)card.append(player);if(s.notes){const note=document.createElement('p');note.className='note';note.textContent=s.notes;card.append(note)}const buttons=document.createElement('div');buttons.className='cardactions';const edit=document.createElement('button');edit.type='button';edit.className='secondary';edit.textContent='编辑';edit.addEventListener('click',()=>fillForm(s.id));const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='删除';del.addEventListener('click',()=>removeSong(s.id));buttons.append(edit,del);card.append(buttons);root.append(card)}}
function resetForm(){ $('songForm').reset();$('editId').value='';$('saveBtn').textContent='添加歌目';$('cancelEdit').hidden=true }
function fillForm(id){const s=songs.find(x=>x.id===id);if(!s)return;$('editId').value=s.id;$('title').value=s.title;$('composer').value=s.composer||'';$('voice').value=s.voice||'全团';$('score').value=s.score||'';$('video').value=s.video||'';$('notes').value=s.notes||'';$('saveBtn').textContent='保存修改';$('cancelEdit').hidden=false;$('management').scrollIntoView({behavior:'smooth',block:'start'})}
function removeSong(id){if(!confirm('确定删除这首歌的资料吗？'))return;songs=songs.filter(s=>s.id!==id);if(save()){$('status').textContent='已删除。';render()}else $('status').textContent='浏览器存储失败，请检查存储空间或隐私设置。'}
$('songForm').addEventListener('submit',e=>{e.preventDefault();const title=$('title').value.trim(),score=$('score').value.trim(),video=$('video').value.trim();if((score&&!safeUrl(score))||(video&&!safeUrl(video))){$('status').textContent='链接格式无效，请输入以 http:// 或 https:// 开头的链接。';return}const id=$('editId').value;const item={id:id||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())),title,composer:$('composer').value.trim(),voice:$('voice').value,score,video,notes:$('notes').value.trim()};if(id)songs=songs.map(s=>s.id===id?item:s);else songs.unshift(item);if(save()){$('status').textContent=id?'修改已保存。':'歌目已添加。';resetForm();render()}else $('status').textContent='浏览器存储失败，请检查存储空间或隐私设置。'});
$('cancelEdit').addEventListener('click',resetForm);$('search').addEventListener('input',render);$('filter').addEventListener('change',render);render();
</script>
</body>
</html>
